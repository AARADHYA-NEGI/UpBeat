name: Build UpBeat Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout UpBeat Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Frontend & Sync Capacitor Android
        working-directory: argon_music/frontend
        run: |
          npm install
          npm run build
          npx cap sync android

      - name: Build Android Debug APK
        working-directory: argon_music/frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/UpBeat.apk

      - name: Upload UpBeat-Android-APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UpBeat-Android-APK
          path: argon_music/frontend/android/app/build/outputs/apk/debug/UpBeat.apk

      - name: Publish UpBeat.apk to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: "UpBeat v2.0 — Android APK & macOS Release"
          files: argon_music/frontend/android/app/build/outputs/apk/debug/UpBeat.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
