name: Build UpBeat Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout UpBeat Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Frontend & Sync Capacitor Android
        working-directory: argon_music/frontend
        run: |
          npm install
          npm run build
          npx cap sync android

      - name: Build Android Debug APK
        working-directory: argon_music/frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload UpBeat.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UpBeat-Android-APK
          path: argon_music/frontend/android/app/build/outputs/apk/debug/app-debug.apk
